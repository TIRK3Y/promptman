[package]
name = "promptman"
version = "1.0.0"
description = "Compare cloud and local LLMs side by side, with token, cost and quality tracking"
edition = "2021"
license = "MIT"
authors = ["TIRK3Y"]
repository = "https://github.com/TIRK3Y/promptman"
readme = "README.md"
keywords = ["llm", "prompt-engineering", "egui", "ollama", "desktop"]
categories = ["development-tools", "gui", "command-line-utilities"]
# egui_plot 0.37 and egui_commonmark 0.25 require Rust 1.95.
rust-version = "1.95"
default-run = "promptman"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tiktoken-rs = "0.7"
# Only used to read and migrate the old vault.enc key file.
aes-gcm = "0.10"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui_plot = "0.37.0"
egui_commonmark = "0.25.0"
similar = "3.2.0"
sysinfo = "0.39.6"
regex = "1.13.1"
csv = "1.4.0"
rfd = "0.17.2"
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-util = "0.7"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# winit 0.30.13 adds IME rect coordinates without overflow checks; debug builds
# panic on it (ime.rs:122). Release builds already wrap, so match that in dev.
[profile.dev.package.winit]
overflow-checks = false

# Installers: `cargo packager --release` (install with `cargo install cargo-packager`).
[package.metadata.packager]
product-name = "PromptMan"
identifier = "com.promptman.app"
description = "Compare cloud and local LLMs side by side"
icons = ["assets/icons/app-icon.png", "assets/icons/icon.ico", "assets/icons/icon.icns"]
before-packaging-command = "cargo build --release"
binaries = [{ path = "promptman", main = true }, { path = "promptman-cli", main = false }]
